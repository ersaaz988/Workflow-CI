name: CI/CD Pipeline MLProject

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas scikit-learn

    - name: Execute MLProject
      run: |
        cd MLProject
        mlflow run . --env-manager=local

    - name: Read Run ID
      id: extract_id
      run: |
        cd MLProject
        RUN_ID=$(cat run_id.txt)
        echo "ID Model yang dihasilkan: $RUN_ID"
        echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

    - name: Build Docker Image via MLflow
      run: |
        cd MLProject
        mlflow models build-docker -m mlruns/0/${{ env.RUN_ID }}/artifacts/model -n ${{ secrets.DOCKER_USERNAME }}/model-sentimen:v1

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/model-sentimen:v1

    - name: Save Artifacts to GitHub (Syarat Skilled)
      uses: actions/upload-artifact@v3
      with:
        name: trained-model-artifacts
        path: MLProject/mlruns/
